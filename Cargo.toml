[workspace]
resolver = "2"
members = [
    "crates/sip-syntax",
    "crates/sip-stack",
    "crates/rtp",
    "crates/media",
    "crates/call",
    "crates/engine-sim",
    "apps/pbx-daemon",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false

# Planned external crates, with versions pinned here as they get used.
# The skeleton has no external dependencies yet (so `cargo check` always
# passes); entries are resolved only when a crate actually uses them.
[workspace.dependencies]
anyhow = "1"
thiserror = "2"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "macros",
    "signal",
    "fs",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
winnow = "0.6"          # candidate for SIP/SDP parsing (sip-syntax)
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
